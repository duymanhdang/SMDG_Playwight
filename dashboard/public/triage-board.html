<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage Board — SimpleMDG Automation Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
.filters { display: flex; gap: 8px; align-items: center; }
.filters select {
  padding: 6px 10px; border: 1px solid var(--border-md); border-radius: var(--r);
  background: var(--surface); color: var(--text); font-size: 12px; font-family: var(--sans);
}
.triage-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: capitalize; }
.triage-status.bug { background: color-mix(in oklch, var(--red) 18%, transparent); color: var(--red); }
.triage-status.environment-issue { background: color-mix(in oklch, var(--orange) 18%, transparent); color: var(--orange); }
.triage-status.flaky-ignore { background: color-mix(in oklch, var(--text-4) 18%, transparent); color: var(--text-3); }
.triage-status.investigating { background: color-mix(in oklch, var(--blue) 18%, transparent); color: var(--blue); }
.triage-note { color: var(--text-3); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="shell-slot"></div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">Triage Board</div>
      <div class="topbar-sub">Every triage annotation across all runs, in one place</div>
    </div>
  </div>
  <div class="page-body">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Filters</span>
        <div class="filters">
          <select id="fStatus" onchange="renderBoard()">
            <option value="">All statuses</option>
            <option value="bug">Bug</option>
            <option value="environment-issue">Environment issue</option>
            <option value="flaky-ignore">Flaky (ignore)</option>
            <option value="investigating">Investigating</option>
          </select>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Triage entries</span><span id="triageCount" style="font-size:11px;color:var(--text-4)"></span></div>
      <div id="triageBody" style="padding:0"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script src="/deep-link.js"></script>
<script>
// Deep-link URL state (v1.5.0 item 2) — status filter.
const TRIAGE_BOARD_DEEP_LINK_SPEC = { status: { key: 'status', default: '' } };
function restoreFiltersFromUrl() {
  const state = parseDeepLinkParams(new URLSearchParams(location.search), TRIAGE_BOARD_DEEP_LINK_SPEC);
  if (state.status) $('fStatus').value = state.status;
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtDate(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let allTriage = [];

async function loadTriage() {
  try {
    const data = await fetch('/api/triage').then(r => r.json());
    if (!data.ok) throw new Error(data.error);
    allTriage = data.triage || [];
    renderBoard();
  } catch (err) {
    $('triageBody').innerHTML = `<div class="empty">⚠ ${err.message}</div>`;
  }
}

function renderBoard() {
  const statusFilter = $('fStatus').value;
  syncDeepLinkState({ status: statusFilter }, TRIAGE_BOARD_DEEP_LINK_SPEC);
  const rows = allTriage
    .filter(t => !statusFilter || t.status === statusFilter)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  $('triageCount').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`;

  if (!rows.length) {
    $('triageBody').innerHTML = `
      <div class="empty-illustration">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="34" stroke="var(--green)" stroke-width="3"/>
          <polyline points="35,51 45,61 66,39" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="empty-heading">Nothing to triage</div>
        <div class="empty-copy">Annotate a failed test from Results to see it here.</div>
      </div>`;
    return;
  }

  $('triageBody').innerHTML = `<table>
    <thead><tr>
      <th style="width:16%">Suite</th>
      <th style="width:28%">Test</th>
      <th style="width:14%">Status</th>
      <th style="width:22%">Note</th>
      <th style="width:12%">Updated</th>
      <th style="width:8%;text-align:right">Link</th>
    </tr></thead>
    <tbody>
      ${rows.map(t => `
        <tr>
          <td class="col-mono">${escapeHtml(t.suiteName)}</td>
          <td class="col-mono">${escapeHtml(t.title)}</td>
          <td><span class="triage-status ${t.status}">${escapeHtml((t.status || '').replace('-', ' '))}</span></td>
          <td class="triage-note" title="${escapeHtml(t.note)}">${escapeHtml(t.note) || '—'}</td>
          <td class="col-mono">${fmtDate(t.updatedAt)}</td>
          <td style="text-align:right">
            ${t.lastRunId ? `<a class="btn-tiny" href="/results.html?id=${encodeURIComponent(t.lastRunId)}">Open run</a>` : '<span style="color:var(--text-4)">—</span>'}
          </td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function onShellReady() {
  restoreFiltersFromUrl();
  loadTriage();
}
initShell('triage-board');
</script>
</body>
</html>
